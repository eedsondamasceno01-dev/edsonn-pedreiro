<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Edson Pedreiro - Controle de Serviços</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f2f2;color:#111}
  .wrap{max-width:900px;margin:auto;padding:16px}
  .hero{background:#111;color:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px}
  .logo-img{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff}
  h1{font-size:23px;margin:0}
  .sub{color:#ccc;margin-top:3px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  button,.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer;background:#111;color:#fff}
  .outline{background:#fff;color:#111;border:1px solid #111}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
  label{display:block;font-weight:700;margin-top:10px;margin-bottom:5px}
  input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit}
  textarea{min-height:75px;resize:vertical}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:#fff;border-radius:14px;padding:14px}
  .stat b{display:block;font-size:12px;color:#666}
  .stat strong{font-size:20px}
  .saldo{background:#111;color:#fff}
  .saldo b{color:#bbb}
  .saldo strong{font-size:27px}
  .service{cursor:pointer;border:2px solid transparent}
  .service:hover{border-color:#111}
  .line{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-top:1px solid #eee;padding:11px 0}
  .muted{color:#666;font-size:13px}
  .amount{font-weight:900;white-space:nowrap}
  .pay-actions{display:flex;gap:6px;margin-top:7px}
  .mini{padding:6px 9px;border-radius:7px;font-size:11px}
  .danger{background:#fff;color:#b00020;border:1px solid #b00020}
  .receipt{background:#fff;color:#111;border:1px solid #111}
  .receipt-badge{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:7px;background:#f0f0f0;font-size:11px;font-weight:700}
  .hidden{display:none}
  .section-title{font-size:20px;font-weight:900;margin:18px 0 9px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .notice{background:#fff4cc;padding:10px;border-radius:10px;font-size:13px}
  .print-logo{display:none}
  @media(max-width:650px){
    .grid,.two{grid-template-columns:1fr}
    .bar button{flex:1}
    .hero{align-items:center}
    .logo-img{width:78px;height:78px}
    h1{font-size:20px}
  }
  @media print{
    body{background:#fff}
    .no-print{display:none!important}
    .wrap{max-width:none;padding:0}
    .hero{background:#fff;color:#111;padding:0;border-radius:0}
    .sub{color:#555}
    .card,.stat{box-shadow:none;border:1px solid #ddd}
    .saldo{background:#fff;color:#111}
    .saldo b{color:#666}
    .print-logo{display:block;width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 12px}
  }
</style>
</head>

      <h1>EDSON PEDREIRO</h1>
      <div class="sub">Controle de Serviços, Extras, Vales e Pagamentos</div>

  <div id="home">
    <div class="bar no-print">
      <button onclick="showNewService()">+ Novo serviço</button>
      <button class="outline" onclick="downloadBackup()">Backup</button>
      <label class="btn outline" style="margin:0">
        Restaurar
        <input id="restoreFile" type="file" accept=".json" hidden onchange="restoreBackup(event)">
      </label>
    </div>

    <div id="newService" class="card hidden no-print">
      <h3>Novo serviço</h3>

      <label>Cliente</label>
      <input id="sCliente" placeholder="Nome do cliente">

      <label>Descrição do serviço</label>
      <textarea id="sDesc" placeholder="Ex.: reforma, piso, alvenaria..."></textarea>

      <div class="two">
        <div>
          <label>Local</label>
          <input id="sLocal" placeholder="Endereço ou bairro">
        </div>
        <div>
          <label>Data de início</label>
          <input id="sData" type="date">
        </div>
      </div>

      <label>Valor total do serviço (R$)</label>
      <input id="sValor" inputmode="decimal" placeholder="Ex.: 5000,00">

      <div class="bar">
        <button onclick="saveService()">Salvar</button>
        <button class="outline" onclick="hideNewService()">Cancelar</button>
      </div>
    </div>

    <div class="section-title">Serviços</div>
    <div id="serviceList"></div>
  </div>

            <option>PIX</option>
            <option>DINHEIRO</option>
            <option>TRANSFERÊNCIA</option>
            <option>OUTRO</option>
          </select>
        </div>

        <div>
          <label>Valor (R$)</label>
          <input id="pValor" inputmode="decimal" placeholder="Ex.: 500,00">
        </div>
      </div>

      <div class="two">
        <div>
          <label>Data</label>
          <input id="pData" type="date">
        </div>

        <div>
          <label>Comprovante PIX/PDF</label>
          <input id="pFile" type="file" accept="application/pdf,image/*">
        </div>
      </div>

      <label>Observação</label>
      <textarea id="pObs" placeholder="Ex.: vale da semana"></textarea>

      <div class="bar">
        <button onclick="savePayment()" id="paymentSaveBtn">Salvar</button>
        <button class="outline" onclick="hidePayment()">Cancelar</button>
      </div>

      <div class="notice">
        O nome do comprovante fica registrado. Mantenha o PDF original salvo no celular ou computador.
      </div>
    </div>

    <div class="section-title">Serviços extras</div>
    <div id="extraServices" class="card"></div>

    <div class="section-title">Histórico</div>
    <div id="payments" class="card"></div>
  </div>

</div>

<script>
const KEY='edson_servicos_v3_logo';
let data = JSON.parse(localStorage.getItem(KEY) || '{"services":[],"payments":[],"extras":[]}');
if(!Array.isArray(data.extras)) data.extras=[];
let currentId=null;
let editingPaymentId=null;
let editingExtraId=null;

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>Number(String(v).replace(/\./g,'').replace(',','.'));

function showNewService(){
  $('newService').classList.remove('hidden');
  $('sData').value=today();
}

function hideNewService(){
  $('newService').classList.add('hidden');
}

function saveService(){
  const cliente=$('sCliente').value.trim();
  const valor=num($('sValor').value);

  if(!cliente || !Number.isFinite(valor) || valor<=0){
    alert('Informe o cliente e um valor válido.');
    return;
  }

  const id=Date.now();

  data.services.unshift({
    id,
    cliente,
    desc:$('sDesc').value.trim(),
    local:$('sLocal').value.trim(),
    date:$('sData').value,
    valor
  });

  save();

  ['sCliente','sDesc','sLocal','sValor'].forEach(i=>$(i).value='');
  hideNewService();
  renderHome();
}

function totals(id){
  const s=data.services.find(x=>x.id===id);
  const rec=data.payments.filter(p=>p.serviceId===id).reduce((a,p)=>a+Number(p.valor||0),0);
  const extras=data.extras.filter(e=>e.serviceId===id).reduce((a,e)=>a+Number(e.valor||0),0);
  const total=Number(s.valor||0)+extras;
  return {s,rec,extras,total,saldo:total-rec};
}

function renderHome(){
  const box=$('serviceList');
  box.innerHTML='';

  if(!data.services.length){
    box.innerHTML='<div class="card muted">Nenhum serviço cadastrado.</div>';
    return;
  }

  data.services.forEach(s=>{
    const t=totals(s.id);
    const d=document.createElement('div');
    d.className='card service';
    d.onclick=()=>openService(s.id);

    d.innerHTML=`
      <b style="font-size:19px">${esc(s.cliente)}</b>
      <div class="muted">${esc(s.desc||'Serviço sem descrição')}</div>
      <div class="grid" style="margin-top:12px">
        <div><span class="muted">Valor total</span><br><b>${money(t.total)}</b></div>
        <div><span class="muted">Recebido</span><br><b>${money(t.rec)}</b></div>
        <div><span class="muted">Saldo</span><br><b>${money(t.saldo)}</b></div>
      </div>`;

    box.appendChild(d);
  });
}

function openService(id){
  currentId=id;
  $('home').classList.add('hidden');
  $('detail').classList.remove('hidden');
  renderDetail();
}

function goHome(){
  currentId=null;
  $('detail').classList.add('hidden');
  $('home').classList.remove('hidden');
  renderHome();
}

function renderDetail(){
  const t=totals(currentId);
  const s=t.s;

  $('serviceHeader').innerHTML=`
    <div class="card">
      <h2 style="margin:0">${esc(s.cliente)}</h2>
      <div class="muted">${esc(s.desc||'')}</div>
      <div class="muted">${esc(s.local||'')} ${s.date?'• '+esc(s.date):''}</div>
    </div>
    <div class="grid">
      <div class="stat"><b>VALOR ORIGINAL</b><strong>${money(s.valor)}</strong><div class="muted">Extras: ${money(t.extras)}</div></div>
      <div class="stat"><b>VALOR TOTAL</b><strong>${money(t.total)}</strong><div class="muted">Recebido: ${money(t.rec)}</div></div>
      <div class="stat saldo"><b>SALDO A RECEBER</b><strong>${money(t.saldo)}</strong></div>
    </div>`;

  const extraList=data.extras.filter(e=>e.serviceId===currentId)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  $('extraServices').innerHTML=extraList.length
    ? extraList.map(e=>`
      <div class="line">
        <div style="flex:1">
          <b>${esc(e.desc||'Serviço extra')}</b>
          <div class="muted">${esc(e.date||'')}</div>
          <div class="pay-actions no-print">
            <button class="mini" onclick="editExtraService(${e.id})">✏️ Editar</button>
            <button class="mini danger" onclick="deleteExtraService(${e.id})">🗑️ Excluir</button>
          </div>
        </div>
        <div class="amount">+ ${money(e.valor)}</div>
      </div>`).join('')
    : '<div class="muted">Nenhum serviço extra adicionado.</div>';

  const list=data.payments.filter(p=>p.serviceId===currentId)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  $('payments').innerHTML=list.length
    ? list.map(p=>`
      <div class="line">
        <div style="flex:1">
          <b>${esc(p.tipo)} • ${esc(p.date)}</b>
          <div class="muted">${esc(p.obs||'')}</div>
          ${p.file?`<div class="muted">Comprovante: ${esc(p.file)}</div>`:''}
          <div class="pay-actions no-print">
            ${(p.fileData||p.fileNativeId)?`<button class="mini receipt" onclick="viewReceipt(${p.id})">📎 Visualizar comprovante PIX</button>`:''}
            <button class="mini" onclick="editPayment(${p.id})">✏️ Editar</button>
            <button class="mini danger" onclick="deletePayment(${p.id})">🗑️ Excluir</button>
          </div>
        </div>
        <div class="amount">- ${money(p.valor)}</div>
      </div>`).join('')
    : '<div class="muted">Nenhum pagamento registrado.</div>';
}

function showExtraService(){
  editingExtraId=null;
  $('extraServiceTitle').textContent='Adicionar serviço extra';
  $('extraServiceSaveBtn').textContent='Adicionar';
  $('eDesc').value='';
  $('eValor').value='';
  $('eData').value=today();
  $('extraServiceForm').classList.remove('hidden');
}

function hideExtraService(){
  editingExtraId=null;
  $('extraServiceForm').classList.add('hidden');
}

function saveExtraService(){
  const desc=$('eDesc').value.trim();
  const valor=num($('eValor').value);
  if(!desc || !Number.isFinite(valor) || valor<=0){
    alert('Informe a descrição e um valor válido para o serviço extra.');
    return;
  }

  if(editingExtraId!==null){
    const e=data.extras.find(x=>x.id===editingExtraId);
    if(e){
      e.desc=desc;
      e.valor=valor;
      e.date=$('eData').value;
    }
  }else{
    data.extras.push({
      id:Date.now(),
      serviceId:currentId,
      desc,
      valor,
      date:$('eData').value
    });
  }

  save();
  hideExtraService();
  renderDetail();
}

function editExtraService(id){
  const e=data.extras.find(x=>x.id===id);
  if(!e)return;
  editingExtraId=id;
  $('extraServiceTitle').textContent='Editar serviço extra';
  $('extraServiceSaveBtn').textContent='Salvar alteração';
  $('eDesc').value=e.desc||'';
  $('eValor').value=Number(e.valor).toFixed(2).replace('.',',');
  $('eData').value=e.date||today();
  $('extraServiceForm').classList.remove('hidden');
  $('extraServiceForm').scrollIntoView({behavior:'smooth',block:'start'});
}

function deleteExtraService(id){
  const e=data.extras.find(x=>x.id===id);
  if(!e)return;
  if(!confirm('Excluir o serviço extra "'+(e.desc||'')+'" de '+money(e.valor)+'?'))return;
  data.extras=data.extras.filter(x=>x.id!==id);
  save();
  renderDetail();
}

function showPayment(){
  editingPaymentId=null;
  $('paymentTitle').textContent='Novo vale / pagamento';
  $('paymentSaveBtn').textContent='Salvar';
  $('pTipo').value='VALE';
  $('pValor').value='';
  $('pData').value=today();
  $('pObs').value='';
  $('pFile').value='';
  $('paymentForm').classList.remove('hidden');
}

function hidePayment(){
  editingPaymentId=null;
  $('paymentForm').classList.add('hidden');
}

function editPayment(id){
  const p=data.payments.find(x=>x.id===id);
  if(!p)return;
  editingPaymentId=id;
  $('paymentTitle').textContent='Editar vale / pagamento';
  $('paymentSaveBtn').textContent='Salvar alteração';
  $('pTipo').value=p.tipo;
  $('pValor').value=Number(p.valor).toFixed(2).replace('.',',');
  $('pData').value=p.date||today();
  $('pObs').value=p.obs||'';
  $('pFile').value='';
  $('paymentForm').classList.remove('hidden');
  $('paymentForm').scrollIntoView({behavior:'smooth',block:'start'});
}

function deletePayment(id){
  const p=data.payments.find(x=>x.id===id);
  if(!p)return;
  if(!confirm('Excluir este recebimento de '+money(p.valor)+'?'))return;
  data.payments=data.payments.filter(x=>x.id!==id);
  save();
  renderDetail();
}

async function fileToDataURL(file){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function viewReceipt(id){
  const p=data.payments.find(x=>x.id===id);
  if(!p){
    alert('Comprovante não encontrado.');
    return;
  }

  try{
    if(p.fileNativeId && window.AndroidBridge && typeof AndroidBridge.openStoredReceipt === 'function'){
      AndroidBridge.openStoredReceipt(p.fileNativeId, p.file||'comprovante', p.fileType||'application/octet-stream');
      return;
    }
  }catch(e){}

  if(!p.fileData){
    alert('Este lançamento não possui comprovante salvo.');
    return;
  }

  try{
    if(window.AndroidBridge && typeof AndroidBridge.openDataUrl === 'function'){
      AndroidBridge.openDataUrl(p.fileData, p.file||'comprovante', p.fileType||'application/octet-stream');
      return;
    }
  }catch(e){}

  const w=window.open();
  if(!w){
    alert('Permita pop-ups para visualizar o comprovante.');
    return;
  }
  if((p.fileType||'').includes('pdf')){
    w.document.write(`
      <!doctype html><html><head><meta charset="utf-8"><title>Comprovante PIX</title>
      <style>html,body{margin:0;height:100%;font-family:Arial}object{width:100%;height:100%}.top{padding:10px;background:#111;color:#fff}</style>
      </head><body><div class="top">Comprovante PIX — ${esc(p.file||'PDF')}</div>
      <object data="${receiptData}" type="application/pdf">
        <p>Seu navegador não abriu o PDF. <a href="${receiptData}" target="_blank">Clique aqui para abrir.</a></p>
      </object></body></html>`);
  } else {
    w.document.write(`
      <!doctype html><html><head><meta charset="utf-8"><title>Comprovante PIX</title>
      <style>body{margin:0;background:#222;text-align:center;font-family:Arial}.top{padding:10px;background:#111;color:#fff}img{max-width:100%;height:auto;background:#fff}</style>
      </head><body><div class="top">Comprovante PIX — ${esc(p.file||'Imagem')}</div>
      <img src="${receiptData}"></body></html>`);
  }
  w.document.close();
}

async function savePayment(){
  const valor=num($('pValor').value);
  if(!Number.isFinite(valor)||valor<=0){
    alert('Informe um valor válido.');
    return;
  }

  const f=$('pFile').files[0];
  let fileData=null;
  let fileType=null;
  let fileNativeId=null;

  if(f){
    if(f.size > 8 * 1024 * 1024){
      alert('O comprovante é muito grande. Use um PDF ou imagem de até aproximadamente 8 MB.');
      return;
    }

    fileData=await fileToDataURL(f);
    fileType=f.type || (f.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : '');

    try{
      if(window.AndroidBridge && typeof AndroidBridge.saveReceipt === 'function'){
        fileNativeId=AndroidBridge.saveReceipt(fileData, f.name, fileType);
        if(fileNativeId){
          // No APK, save the actual file natively instead of filling localStorage with base64.
          fileData=null;
        }
      }
    }catch(e){}
  }

  if(editingPaymentId!==null){
    const p=data.payments.find(x=>x.id===editingPaymentId);
    if(p){
      p.tipo=$('pTipo').value;
      p.valor=valor;
      p.date=$('pData').value;
      p.obs=$('pObs').value.trim();
      if(f){
        p.file=f.name;
        p.fileData=fileData;
        p.fileNativeId=fileNativeId;
        p.fileType=fileType;
      }
    }
  } else {
    data.payments.push({
      id:Date.now(),
      serviceId:currentId,
      tipo:$('pTipo').value,
      valor,
      date:$('pData').value,
      obs:$('pObs').value.trim(),
      file:f?f.name:'',
      fileData:fileData,
      fileNativeId:fileNativeId,
      fileType:fileType
    });
  }

  try{
    save();
  }catch(e){
    alert('Não foi possível salvar. Tente novamente.');
    return;
  }

  $('pValor').value='';
  $('pObs').value='';
  $('pFile').value='';
  editingPaymentId=null;
  hidePayment();
  renderDetail();
  alert('Pagamento e comprovante salvos com sucesso.');
}

function gerarHtmlCliente(){
  const t=totals(currentId);
  const s=t.s;
  const lista=data.payments
    .filter(p=>p.serviceId===currentId)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const extrasLista=data.extras
    .filter(e=>e.serviceId===currentId)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const extrasLinhas=extrasLista.map(e=>`<div class="row"><div class="grow"><b>${esc(e.desc||'Serviço extra')}</b><div class="small">${esc(e.date||'')}</div></div><div class="amount">+ ${money(e.valor)}</div></div>`).join('');

  const linhas=lista.map(p=>{
    let receiptData=p.fileData||'';
    try{
      if(!receiptData && p.fileNativeId && window.AndroidBridge && typeof AndroidBridge.readStoredReceipt === 'function'){
        receiptData=AndroidBridge.readStoredReceipt(p.fileNativeId);
      }
    }catch(e){}
    const comprovante = receiptData ? (
      (p.fileType||'').includes('pdf')
      ? `<div class="proof"><b>Comprovante PIX:</b> ${esc(p.file||'comprovante.pdf')}<br>
           <a class="proofbtn" href="${receiptData}" target="_blank">📎 Visualizar comprovante PIX</a>
           <object data="${receiptData}" type="application/pdf" class="pdfbox">
             <a href="${receiptData}" target="_blank">Abrir comprovante PDF</a>
           </object></div>`
      : `<div class="proof"><b>Comprovante PIX:</b> ${esc(p.file||'imagem')}<br>
           <a class="proofbtn" href="${receiptData}" target="_blank">📎 Visualizar comprovante PIX</a>
           <img class="proofimg" src="${receiptData}" alt="Comprovante PIX"></div>`
    ) : (p.file ? `<div class="small">Comprovante informado: ${esc(p.file)}</div>` : '');

    return `<div class="row">
      <div class="grow">
        <b>${esc(p.tipo)}</b> — ${esc(p.date||'')}
        <div class="small">${esc(p.obs||'')}</div>
        ${comprovante}
      </div>
      <div class="amount">- ${money(p.valor)}</div>
    </div>`;
  }).join('');

  return `<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Valores - ${esc(s.cliente)}</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f4f4;color:#111}
.wrap{max-width:800px;margin:auto;padding:18px}
.header{background:#111;color:#fff;border-radius:16px;padding:20px;text-align:center}
.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#ccc}
.card{background:#fff;border-radius:14px;padding:16px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px}
.stat small{display:block;color:#666;font-weight:bold}.stat strong{display:block;font-size:21px;margin-top:6px}
.saldo{background:#111;color:#fff}.saldo small{color:#ccc}
.row{display:flex;gap:12px;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}
.grow{flex:1}.amount{font-weight:bold;white-space:nowrap}.small{color:#666;font-size:13px;margin-top:4px}
.proof{margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fafafa}
.proofbtn{display:inline-block;margin-top:8px;padding:9px 12px;background:#111;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold}
.pdfbox{display:block;width:100%;height:420px;margin-top:10px;border:1px solid #ddd}
.proofimg{display:block;max-width:100%;margin-top:10px;border:1px solid #ddd}
.note{font-size:12px;color:#666;margin-top:15px;text-align:center}
@media(max-width:600px){.grid{grid-template-columns:1fr}.pdfbox{height:520px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>EDSON PEDREIRO</h1>
    <p>Controle de Serviços, Extras, Vales e Pagamentos</p>
  </div>

  <div class="card">
    <h2>${esc(s.cliente)}</h2>
    <div><b>Serviço principal:</b> ${esc(s.desc||'')}</div>
    <div><b>Local:</b> ${esc(s.local||'')}</div>
    <div><b>Data de início:</b> ${esc(s.date||'')}</div>
  </div>

  <div class="grid">
    <div class="stat"><small>VALOR ORIGINAL</small><strong>${money(s.valor)}</strong><div class="small">Extras: ${money(t.extras)}</div></div>
    <div class="stat"><small>VALOR TOTAL</small><strong>${money(t.total)}</strong><div class="small">Recebido: ${money(t.rec)}</div></div>
    <div class="stat saldo"><small>SALDO A RECEBER</small><strong>${money(t.saldo)}</strong></div>
  </div>

  <div class="card">
    <h3>Serviços extras</h3>
    ${extrasLinhas || '<div>Nenhum serviço extra adicionado.</div>'}
  </div>

  <div class="card">
    <h3>Histórico de recebimentos</h3>
    ${linhas || '<div>Nenhum recebimento registrado.</div>'}
  </div>

  <div class="note">Arquivo gerado pelo aplicativo Edson Pedreiro. Os comprovantes PIX incorporados podem ser abertos pelos botões acima.</div>
</div>
</body>
</html>`;
}

async function enviarControleCliente(){
  if(currentId===null){
    alert('Abra um serviço primeiro.');
    return;
  }

  const html=gerarHtmlCliente();

  try{
    if(window.AndroidBridge && typeof AndroidBridge.shareHtml === 'function'){
      AndroidBridge.shareHtml(html);
      return;
    }
  }catch(e){}

  const blob=new Blob([html],{type:'text/html'});
  const nome='controle-valores-cliente.html';
  const file=new File([blob],nome,{type:'text/html'});

  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        title:'Controle de valores',
        text:'Segue o controle de valores com os comprovantes PIX.',
        files:[file]
      });
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=nome;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  alert('O controle foi gerado. Envie o arquivo ao cliente pelo WhatsApp.');
}

function downloadBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup-edson-servicos.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function restoreBackup(e){
  const f=e.target.files[0];
  if(!f)return;

  const r=new FileReader();

  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x.services||!x.payments)throw 0;
      if(!Array.isArray(x.extras)) x.extras=[];
      data=x;
      save();
      renderHome();
      alert('Backup restaurado.');
    }catch{
      alert('Arquivo de backup inválido.');
    }
  };

  r.readAsText(f);
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}


function imprimirOuSalvarPDF(){
  try{
    if(window.AndroidBridge && typeof AndroidBridge.printPage === 'function'){
      AndroidBridge.printPage();
      return;
    }
  }catch(e){}
  window.print();
}

renderHome();
</script>
</body>
</html>
